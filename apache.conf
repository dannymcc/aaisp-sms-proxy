# Log format that omits query strings, keeping tokens out of access logs.
# The default vhost (000-default.conf) is patched in the Dockerfile to use
# this format instead of the standard "combined" format.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_noquerystring
